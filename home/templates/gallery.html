{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .gallery-img {
        height: 250px;
        width: 100%;
        object-fit: cover;
    }
</style>

<section class="reveal">
    <div class="container my-5">
        <div class="row g-4">
            {% for image in gallery reversed %}
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-12">
                <div class="card h-100 border-0 shadow-sm overflow-hidden">
                    <img src="{{ image.img.url }}" class="gallery-img" alt="Gallery">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
